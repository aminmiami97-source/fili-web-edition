services:
  - type: web
    name: fili-web-edition
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: Qwen/Qwen3-0.6B
      - key: HF_API_URL
        value: https://router.huggingface.co/v1/chat/completions