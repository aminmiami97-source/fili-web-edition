name: Validate FILI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check browser application syntax
        run: node --check public/app.js
      - name: Check model worker syntax
        run: node --check public/worker.js
      - name: Build static website
        run: npm run build
